name: OmicsMarker checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e '.[analysis]' pytest miniwdl cwltool
      - run: pytest -q
      - run: miniwdl check wdl/omicsmarker.wdl && cwltool --validate cwl/sage_search.cwl
      - run: bash tests/smoke.sh
