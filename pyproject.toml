[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="omicsmarker"
version="1.0.0.dev1"
requires-python=">=3.11,<3.13"
dependencies=["numpy==1.26.4","pandas==2.2.3","scikit-learn==1.5.2","scipy>=1.11,<1.16","matplotlib>=3.7,<4","PyYAML>=6,<7","pyarrow>=17,<24","Jinja2>=3.1.5,<4"]
[project.optional-dependencies]
analysis=["xgboost==2.1.4","tensorflow==2.17.1","shap==0.46.0","pymongo>=4.10,<5","gseapy>=1.1,<2"]
data=["cptac==1.5.14"]
[project.scripts]
omicsmarker="omicsmarker.cli:main"
[tool.setuptools.packages.find]
where=["src"]
